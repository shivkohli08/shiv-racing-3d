<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SHIV Racing 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:white;text-shadow:0 2px 5px #000}
.panel{background:#101820b8;border:1px solid #ffffff40;border-radius:12px;padding:9px 12px;font-weight:700;min-width:88px}
.small{font-size:11px;color:#d6e4ef;font-weight:600}.value{font-size:20px;margin-top:3px}
#controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:68px;height:68px;border:1px solid #ffffff80;border-radius:18px;background:#142536bb;color:white;font-size:25px;font-weight:bold;box-shadow:0 5px 16px #0008;touch-action:none}
.ctrl:active{background:#1c9aeb}
#gas{width:78px;height:78px;background:#087c45d9;font-size:14px}
#brake{width:68px;height:68px;background:#a52b2bd9;font-size:13px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111dcc;color:white;padding:24px;text-align:center}
.card{max-width:360px;width:100%;padding:26px 22px;border-radius:22px;background:linear-gradient(145deg,#162b40f5,#09131ff5);border:1px solid #ffffff40;box-shadow:0 18px 55px #0009}
h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}p{color:#d8e5ef;line-height:1.5;font-size:14px}
#start{border:0;border-radius:12px;padding:14px 28px;background:#16a4ed;color:#fff;font-weight:800;font-size:17px;margin-top:8px}
#hint{position:fixed;top:88px;left:50%;transform:translateX(-50%);color:white;background:#0008;border-radius:20px;padding:7px 12px;font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-height:500px){.ctrl{width:56px;height:56px}.panel{padding:6px 9px}.value{font-size:17px}#controls{bottom:8px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel"><div class="small">SCORE</div><div class="value" id="score">0</div></div>
 <div class="panel"><div class="small">SPEED</div><div class="value"><span id="speed">0</span> <small>KM/H</small></div></div>
 <div class="panel"><div class="small">BEST</div><div class="value" id="best">0</div></div>
</div>
<div id="hint">दूसरी कारों से बचें • सिक्के/स्कोर कमाएँ</div>
<div id="controls">
 <div class="group">
  <button class="ctrl" id="left" aria-label="Left">◀</button>
  <button class="ctrl" id="right" aria-label="Right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" id="brake">BRAKE</button>
  <button class="ctrl" id="gas">GAS ▲</button>
 </div>
</div>
<div id="overlay">
 <div class="card">
  <h1>SHIV RACING 3D</h1>
  <p>Highway Traffic Racing<br>कार चलाएँ, ट्रैफिक से बचें और अपना हाई स्कोर बनाएँ।</p>
  <p>मोबाइल पर ◀ ▶ से कार मोड़ें। GAS से तेज़ और BRAKE से धीमी करें।</p>
  <div style="margin:14px 0 8px;font-weight:700">अपनी कार चुनें</div>
  <div id="garage" style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
   <button class="carpick" data-color="0x087de0" style="background:#087de0">BLUE</button>
   <button class="carpick" data-color="0xe43d30" style="background:#e43d30">RED</button>
   <button class="carpick" data-color="0x20242b" style="background:#20242b">BLACK</button>
   <button class="carpick" data-color="0x159447" style="background:#159447">GREEN</button>
  </div>
  <button id="start">START RACE</button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
const root=document.getElementById('game');
const overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'), speedEl=document.getElementById('speed'), bestEl=document.getElementById('best');
let scene,camera,renderer,player,roadLines=[],traffic=[],trees=[],running=false,score=0,speed=0,best=Number(localStorage.getItem('shivRacingBest')||0),last=0,spawn=0,steer=0,playerColor=0x087de0;
bestEl.textContent=best;
const lanes=[-3.1,0,3.1];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mat(color,roughness=.75){return new THREE.MeshStandardMaterial({color,roughness});}
function box(w,h,d,material,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);parent.add(m);return m;}
function makeCar(color,isPlayer=false){
 const g=new THREE.Group();
 const body=mat(color,.35), glass=mat(0x9fc6dc,.2), black=mat(0x101318), tire=mat(0x171717);
 box(1.65,.48,3.15,body,0,.62,0,g);
 box(1.35,.62,1.55,glass,0,1.12,-.25,g);
 box(1.55,.16,.55,body,0,.91,1.05,g);
 for(const x of [-.86,.86])for(const z of [-1,1]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,16),tire);
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,.38,z);g.add(wheel);
 }
 const lamp=mat(0xfff1bd),tail=mat(0xff2525);
 for(const x of [-.55,.55]){box(.28,.13,.08,lamp,x,.68,1.59,g);box(.25,.13,.08,tail,x,.68,-1.59,g);}
 if(isPlayer){box(.3,.08,.12,mat(0x00aaff),0,1.5,-.25,g);}
 scene.add(g);return g;
}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc7ed);scene.fog=new THREE.Fog(0x8bc7ed,35,145);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);
 camera.position.set(0,7.2,12.5);camera.lookAt(0,0,-8);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 root.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xe6f6ff,0x58734b,2));
 const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-12,22,10);sun.castShadow=true;scene.add(sun);
 const ground=mat(0x43834b);box(200,.2,220,ground,0,-.35,-65);
 const asphalt=mat(0x30343a);box(10,.18,210,asphalt,0,-.18,-65);
 const edge=mat(0xe9e9e9),dash=mat(0xffffff);
 for(const x of [-5.05,5.05])box(.12,.04,210,edge,x,-.07,-65);
 for(const x of [-1.67,1.67])for(let z=-160;z<30;z+=9){roadLines.push(box(.12,.035,4,dash,x,-.06,z));}
 const rail=mat(0x9ba6ad);
 for(const x of [-6,6]){box(.25,.5,210,rail,x,.05,-65);for(let z=-160;z<30;z+=12)box(.28,.8,.3,rail,x,.05,z);}
 const trunk=mat(0x68452b),leaf=mat(0x24713b);
 for(let i=0;i<38;i++){for(const side of [-1,1]){let z=-160+i*5.3;let x=side*(9+Math.random()*4);let t=new THREE.Group();let a=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,1.5,7),trunk);a.position.y=.7;t.add(a);let b=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.7,8),leaf);b.position.y=2.5;t.add(b);t.position.set(x,0,z);scene.add(t);trees.push(t);}}
 player=makeCar(playerColor,true);player.position.set(0,0,5);
 for(let i=0;i<5;i++)spawnTraffic(-25-i*29);
 window.addEventListener('resize',resize);
}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function spawnTraffic(z){const lane=lanes[Math.floor(Math.random()*3)];const colors=[0xe43d30,0xf2b632,0xeeeeee,0x252a35,0x1b9a67,0x9a54c8];let car=makeCar(colors[Math.floor(Math.random()*colors.length)]);car.position.set(lane,0,z);car.userData.passed=false;traffic.push(car);}
function setHold(id,fn){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true);});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();fn(false);}));}
setHold('left',v=>{if(running)steer=v?-1:(steer===-1?0:steer);});
setHold('right',v=>{if(running)steer=v?1:(steer===1?0:steer);});
let gas=false,brake=false;
setHold('gas',v=>gas=v);setHold('brake',v=>brake=v);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key==='ArrowUp'||e.key==='w')gas=true;if(e.key==='ArrowDown'||e.key==='s')brake=true;});
document.addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0;if(['ArrowUp','w'].includes(e.key))gas=false;if(['ArrowDown','s'].includes(e.key))brake=false;});
function endGame(){running=false;best=Math.max(best,score);localStorage.setItem('shivRacingBest',best);bestEl.textContent=best;overlay.style.display='flex';overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('p').innerHTML=`आपका स्कोर: <b>${score}</b><br>Best Score: <b>${best}</b><br>फिर से कोशिश करें!`;document.getElementById('start').textContent='PLAY AGAIN';}
function start(){score=0;speed=0;steer=0;gas=false;brake=false;scoreEl.textContent='0';speedEl.textContent='0';scene.remove(player);player=makeCar(playerColor,true);player.position.set(0,0,5);traffic.forEach(c=>scene.remove(c));traffic=[];for(let i=0;i<5;i++)spawnTraffic(-25-i*29);overlay.style.display='none';running=true;last=performance.now();}
function update(dt){
 if(running){
  const target=gas?34:brake?8:22;speed+=(target-speed)*Math.min(1,dt*1.8);
  player.position.x=clamp(player.position.x+steer*dt*(5.2+speed*.05),-4.05,4.05);
  camera.position.x+=(player.position.x*.28-camera.position.x)*dt*2;
  const move=speed*dt*.85;
  roadLines.forEach(o=>{o.position.z+=move;if(o.position.z>14)o.position.z-=180;});
  trees.forEach(o=>{o.position.z+=move;if(o.position.z>18)o.position.z-=200;});
  spawn+=dt;if(spawn>Math.max(.65,1.55-speed/55)){spawn=0;spawnTraffic(-155);}
  for(let i=traffic.length-1;i>=0;i--){const c=traffic[i];c.position.z+=move*1.18;
   if(Math.abs(c.position.z-player.position.z)<2.1&&Math.abs(c.position.x-player.position.x)<1.35){endGame();break;}
   if(!c.userData.passed&&c.position.z>player.position.z+3){c.userData.passed=true;score+=10;scoreEl.textContent=score;}
   if(c.position.z>18){scene.remove(c);traffic.splice(i,1);}
  }
  score+=dt*speed*.12;scoreEl.textContent=Math.floor(score);speedEl.textContent=Math.round(speed*4);
 }
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000||0,.04);last=now;update(dt);renderer.render(scene,camera);}
document.getElementById('start').addEventListener('click',start);
document.querySelectorAll('.carpick').forEach(btn=>{
 btn.style.border='2px solid #ffffff88';btn.style.borderRadius='9px';btn.style.padding='9px 11px';btn.style.color='#fff';btn.style.fontWeight='800';btn.style.fontSize='11px';
 btn.addEventListener('click',()=>{
  playerColor=Number(btn.dataset.color);
  document.querySelectorAll('.carpick').forEach(b=>b.style.outline='none');
  btn.style.outline='3px solid #fff';
 });
});
init();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
